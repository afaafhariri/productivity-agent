[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true

[features]
# Test doubles for the ports (fakes for confirmation, clock), for this crate's and the app's tests.
testing = []

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
jiff = "1.0.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
agent-core = { path = ".", features = ["testing"] }
tokio = { version = "1.54.1", features = ["full"] }
wiremock = "0.6.5"
