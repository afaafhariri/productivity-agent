[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true

[features]
# Test doubles for the ports (fakes for confirmation, clock), for this crate's and the app's tests.
testing = []

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
jiff = "1.0.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
agent-core = { path = ".", features = ["testing"] }
tokio = { version = "1.54.1", features = ["full"] }
