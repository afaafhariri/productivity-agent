<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Personal Productivity Agent</title>
    <!--
      Strict CSP: only the app's own scripts and assets. The renderer makes no network calls;
      the agent runs in the main process. 'unsafe-inline' styles are for Vite's dev injection.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
