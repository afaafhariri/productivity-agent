[project]
name = "productivity-agent"
version = "0.1.0"
description = "Agent backend: LLM loop, tools and integrations, served to the desktop app over stdio"
readme = "README.md"
authors = [
    { name = "Afaaf Hariri", email = "afaafhariri@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
productivity-agent = "productivity_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ANN", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only, so the core boundary (src/productivity_agent/core/ruff.toml) can't be bypassed.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
