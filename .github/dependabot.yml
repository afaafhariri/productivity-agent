# Weekly dependency updates, grouped to keep the PR count low.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    # Major versions (Electron every few months, React, the AI SDK) arrive as separate PRs.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
