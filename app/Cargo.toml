[package]
name = "personal-productivity-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-core = { version = "0.1.0", path = "../core" }
anyhow = "1.0.104"
async-trait = "0.1.92"
dotenvy = "0.15.7"
futures = "0.3.34"
gpui-kit = "=0.9.1"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Enables GPUI's headless test platform for UI tests (same crates gpui-kit pins).
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.12", features = ["test-support"] }
